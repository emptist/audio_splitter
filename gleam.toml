name = "audio_splitter"
version = "1.0.0"
target = "erlang"

# Standalone offline tool: transcribe dialogue audio with whisper_cpp,
# align word timestamps to transcript turns, split mp3 per turn,
# write JSON manifest. Generic — works with any D:/P: format dialogue.

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
whisper_cpp = ">= 0.5.0 and < 1.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
