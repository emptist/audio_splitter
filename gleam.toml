name = "audio_splitter"
version = "1.2.0"
target = "erlang"
description = "Transcribe dialogue audio with whisper_cpp, align word timestamps to transcript turns, and split mp3 per turn into lossless per-turn clips with a JSON manifest. Generic — works with any D:/P: speaker-prefix dialogue format."
licences = ["Apache-2.0"]

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
whisper_cpp = ">= 0.5.0 and < 1.0.0"
edit_distance = ">= 3.0.1 and < 4.0.0"
gleam_regexp = ">= 1.1.1 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
